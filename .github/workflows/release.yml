name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release / debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both
      create_github_release:
        description: 'Create a GitHub Release (for manual triggers)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android NDK & Accept Licenses
        run: |
          echo "Android SDK root: $ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(which sdkmanager || echo "")
          fi

          echo "Accepting licenses..."
          yes | $SDKMANAGER --licenses || true

          echo "Installing NDK and CMake..."
          $SDKMANAGER --install "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-36" "build-tools;35.0.0" || true

      - name: Restore Keystore for Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # 1. Check if user provided custom release keystore secret
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding custom production keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/release.keystore"
            echo "KEYSTORE_FILE=${{ github.workspace }}/release.keystore" >> $GITHUB_ENV
          fi

          # 2. Always restore debug.keystore from debug.keystore.base64 if present
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 --decode debug.keystore.base64 > debug.keystore || base64 -d debug.keystore.base64 > debug.keystore
          fi

          # 3. Fallback: generate a debug keystore if neither exists
          if [ ! -f debug.keystore ] && [ ! -f release.keystore ]; then
            echo "Generating fallback keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' }}
        run: ./gradlew assembleDebug --stacktrace --info

      - name: Build Release APK
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' }}
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --info

      - name: Prepare APK Outputs
        run: |
          mkdir -p release-apks
          
          REF_TAG="${{ github.ref_name }}"
          [ -z "$REF_TAG" ] && REF_TAG="latest"

          # Collect Release APK
          find app/build/outputs/apk/ -name "*release*.apk" | while read -r apk; do
            filename=$(basename "$apk")
            echo "Found Release APK: $apk"
            cp "$apk" "release-apks/PocketForge-${REF_TAG}-${filename}"
          done

          # Collect Debug APK
          find app/build/outputs/apk/ -name "*debug*.apk" | while read -r apk; do
            filename=$(basename "$apk")
            echo "Found Debug APK: $apk"
            cp "$apk" "release-apks/PocketForge-${REF_TAG}-${filename}"
          done

          echo "Listing all generated APKs:"
          ls -la release-apks/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pocketforge-apks
          path: release-apks/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_github_release == 'true') }}
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
