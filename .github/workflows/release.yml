name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release / debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both
      create_github_release:
        description: 'Create a GitHub Release (for manual triggers)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Signing Keystore (Optional)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding Keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/release.keystore"
            echo "KEYSTORE_FILE=${{ github.workspace }}/release.keystore" >> $GITHUB_ENV
            echo "has_custom_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "No custom keystore provided. Using fallback keystore."
            echo "has_custom_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' }}
        run: ./gradlew assembleDebug

      - name: Build Release APK
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' }}
        env:
          SIGNING_KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Prepare APK Outputs
        run: |
          mkdir -p release-apks
          
          # Tag or Ref name
          REF_TAG="${{ github.ref_name }}"
          [ -z "$REF_TAG" ] && REF_TAG="latest"

          # Collect Release APK
          find app/build/outputs/apk/ -name "*release*.apk" -o -name "*release-unsigned.apk" | while read -r apk; do
            filename=$(basename "$apk")
            echo "Found Release APK: $apk"
            cp "$apk" "release-apks/PocketForge-${REF_TAG}-${filename}"
          done

          # Collect Debug APK
          find app/build/outputs/apk/ -name "*debug.apk" | while read -r apk; do
            filename=$(basename "$apk")
            echo "Found Debug APK: $apk"
            cp "$apk" "release-apks/PocketForge-${REF_TAG}-${filename}"
          done

          echo "Listing all generated APKs:"
          ls -la release-apks/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pocketforge-apks
          path: release-apks/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_github_release == 'true') }}
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
